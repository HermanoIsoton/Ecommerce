services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_DATABASE: "amperemotor"
      MYSQL_USER: "amperemotor"
      MYSQL_PASSWORD: "eletric"
      MYSQL_ROOT_PASSWORD: "eletric"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10

  api:
    container_name: api
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"


  frontend:
    image: nginx:alpine
    container_name: pagina
    ports:
      - "8080:8000"
    volumes:
      - ./frontend-vue:/usr/share/nginx/html:ro

volumes:
  mysql_data: