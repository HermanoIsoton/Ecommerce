services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_DATABASE: "amperemotor"
      MYSQL_USER: "amperemotor"
      MYSQL_PASSWORD: "eletric"
      MYSQL_ROOT_PASSWORD: "eletric"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10

  api:
    container_name: api
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    command: >
      sh -c "
      [ -f .env ] || cp .env.example .env;
      grep -q '^APP_KEY=.\+' .env || php artisan key:generate --no-interaction;
      php artisan migrate --no-interaction &&
      php artisan serve --host=0.0.0.0 --no-reload
      "
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - api_vendor:/app/vendor
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 180s

  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"


  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: pagina
    ports:
      - "8080:80"

volumes:
  mysql_data:
  api_vendor: