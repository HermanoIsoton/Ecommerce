<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentação da API</title>
  <link rel="stylesheet" href="/api/docs/assets/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/api/docs/assets/swagger-ui-bundle.js"></script>
  <script src="/api/docs/assets/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      SwaggerUIBundle({
        url: "/api/docs/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        withCredentials: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset,
        ],
        layout: "StandaloneLayout",
        requestInterceptor: async (request) => {
          request.credentials = "include";

          if (!["GET", "HEAD", "OPTIONS"].includes((request.method || "GET").toUpperCase())) {
            const csrfResponse = await fetch("/sanctum/csrf-cookie", {
              credentials: "include",
              headers: { Accept: "application/json" },
            });

            if (!csrfResponse.ok) {
              throw new Error(`Não foi possível obter o cookie CSRF (HTTP ${csrfResponse.status}).`);
            }

            const xsrfCookie = document.cookie
              .split("; ")
              .find((cookie) => cookie.startsWith("XSRF-TOKEN="));

            if (!xsrfCookie) {
              throw new Error("O servidor não enviou o cookie XSRF-TOKEN.");
            }

            request.headers = request.headers || {};
            request.headers["X-XSRF-TOKEN"] = decodeURIComponent(xsrfCookie.slice("XSRF-TOKEN=".length));
          }

          return request;
        },
      });
    };
  </script>
</body>
</html>
